[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Slow integration tests (e.g. DynamoDB Local) are opt-in: they only run
# with an explicit `-m slow`. A plain `pytest` never touches them.
addopts = -m "not slow"
markers =
    slow: integration tests needing an external emulator
        (e.g. DynamoDB Local); skipped when it is unavailable.
        Run with: pytest -m slow
