# ============================================================================
# TuneIn settings
#
# Database, ingestion, and environment configuration for the TuneIn backend.
# Edit the values below to suit your environment.
# ============================================================================

# --- Database ---------------------------------------------------------------
# Which database backend the ingestion tooling (crawler, batch runner, CLI)
# should use.
#
# Options:
#
#   simple — SimpleDB: a local SQLite file at `backend/ingestion/simple.db`.
#            Zero setup, zero dependencies. Best for local development and
#            batch crawling.
#            Implemented in: backend/ingestion/simple_db.py
#            (overridable per-environment with the INGESTION_DATABASE_URL
#            environment variable)
#
#   app    — App database: the shared application database configured via
#            `database.app.url` below (SQLite file by default, Postgres in
#            production). Best when the API, worker, and ingestion tooling
#            must all share one database.
#            Implemented in: backend/persistence/database.py
#
#   dynamodb — DynamoDB: the single-table serverless backend configured via
#            `database.dynamodb` below. Best for production scale without
#            managing a database server; also works against DynamoDB Local
#            for offline testing.
#            Implemented in: backend/persistence/dynamodb/
#            (overridable per-environment with the DATABASE_DYNAMODB_*
#            environment variables; AWS credentials always come from the
#            standard AWS chain, never from settings)
#
database:
  # Which database backend the ingestion tooling uses: "simple", "app", or
  # "dynamodb". See the header comment above for what each option means.
  backend: simple

  # SimpleDB settings — used when backend is "simple".
  # Path to the SimpleDB SQLite file (relative to the repo root).
  simple:
    path: "backend/ingestion/simple.db"

  # App database settings — used when backend is "app".
  # Examples:
  #   SQLite:   "sqlite+aiosqlite:///./tunedin.db"
  #   Postgres: "postgresql+asyncpg://user:password@localhost:5432/tunedin"
  app:
    url: "sqlite+aiosqlite:///./tunedin.db"

  # DynamoDB settings — used when backend is "dynamodb".
  # The table is provisioned on demand by `init_db()` (ensure_table).
  dynamodb:
    # Single-table name for all entities.
    table_name: "tunedin"
    # AWS region for the table.
    region: "us-east-1"
    # Optional endpoint override for DynamoDB Local testing,
    # e.g. "http://localhost:8000". Leave unset for real AWS.
    # AWS credentials are NEVER stored here — they come from the standard
    # AWS chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars,
    # ~/.aws/credentials, or an IAM role).
    endpoint_url: null

# --- Ingestion ---------------------------------------------------------------
ingestion:
  # iTunes storefront countries used by the top-charts crawler.
  # (The `crawl --countries` CLI flag overrides this per run.)
  crawler_countries:
    - us
    - gb
    - ca
    - au
    - de
    - fr

  # How many of the newest episodes get queued for AI processing on a feed's
  # first sync (avoids flooding the LLM API on large backlogs).
  auto_queue_episodes: 3
